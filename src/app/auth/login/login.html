<div class="login-container">

  <div class="login-card">

    <div class="logo-section">
      <h1>📈 Trading Screen</h1>
      <p>AI Powered Options Analysis Platform</p>
    </div>

    <div class="form-section">

      <h2>Connect Your Broker</h2>

      <div class="form-group">

        <label for="broker">Select Broker</label>

        <select id="broker">
          <option value="" selected disabled>Select Broker</option>
          <option value="aliceblue">Alice Blue</option>
          <option value="zerodha">Zerodha (Coming Soon)</option>
          <option value="upstox">Upstox (Coming Soon)</option>
          <option value="angelone">Angel One (Coming Soon)</option>
        </select>

      </div>

      <button type="button" (click)="connectBroker()">
        🔐 Connect Broker
      </button>

    </div>

    <div class="footer-section">
      <small>
        Secure authentication powered by your broker.
      </small>
    </div>

  </div>

</div>
