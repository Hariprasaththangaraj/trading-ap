<div class="login-page">

  <div class="login-card">

    <!-- Back -->
    <button
      class="back-button"
      type="button"
      (click)="goToHome()">
      ← Back
    </button>


    <!-- Heading -->
    <div class="login-header">

      <h1>Welcome Back</h1>

      <p>Sign in to your Trading App</p>

    </div>


    <!-- Login Form -->
    <form>

      <!-- Username -->
      <div class="form-group">

        <label for="username">
          Username
        </label>

        <input
          id="username"
          type="text"
          placeholder="Enter your username">

      </div>


      <!-- Password -->
      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          placeholder="Enter your password">

      </div>


      <!-- Sign In -->
      <button
        type="submit"
        class="sign-in-submit">
        Sign In
      </button>

    </form>


    <!-- Sign Up -->
    <div class="signup-section">

      <span>Don't have an account?</span>

      <button
        type="button"
        class="signup-link"
        (click)="goToSignup()">
        Sign Up
      </button>

    </div>

  </div>

</div>
