<div class="signup-page">

  <div class="signup-card">

    <!-- Back -->
    <button
      class="back-button"
      type="button"
      (click)="goToHome()">
      ← Back
    </button>


    <!-- Header -->
    <div class="signup-header">

      <h1>Create Account</h1>

      <p>Join H with Hari Trading App</p>

    </div>


    <!-- Signup Form -->
    <form (ngSubmit)="signup()">

      <!-- Name -->
      <div class="form-group">

        <label for="name">
          Full Name
        </label>

        <input
          id="name"
          name="name"
          type="text"
          [(ngModel)]="signupData.name"
          placeholder="Enter your full name"
          required>

      </div>


      <!-- Email -->
      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="signupData.email"
          placeholder="Enter your email"
          required>

      </div>


      <!-- Phone -->
      <div class="form-group">

        <label for="phoneNumber">
          Phone Number
        </label>

        <input
          id="phoneNumber"
          name="phoneNumber"
          type="tel"
          [(ngModel)]="signupData.phoneNumber"
          placeholder="Enter your phone number"
          required>

      </div>


      <!-- Username -->
      <div class="form-group">

        <label for="username">
          Username
        </label>

        <input
          id="username"
          name="username"
          type="text"
          [(ngModel)]="signupData.username"
          placeholder="Choose a username"
          required>

      </div>


      <!-- Password -->
      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="signupData.password"
          placeholder="Create a password"
          required>

      </div>


      <!-- Confirm Password -->
      <div class="form-group">

        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          placeholder="Confirm your password"
          required>

      </div>


      <!-- Error Message -->
      <div
        class="error-message"
        *ngIf="errorMessage">

        {{ errorMessage }}

      </div>


      <!-- Success Message -->
      <div
        class="success-message"
        *ngIf="successMessage">

        {{ successMessage }}

      </div>


      <!-- Sign Up -->
      <button
        type="submit"
        class="signup-submit"
        [disabled]="isLoading">

        {{ isLoading ? 'Creating Account...' : 'Create Account' }}

      </button>

    </form>


    <!-- Login -->
    <div class="login-section">

      <span>Already have an account?</span>

      <button
        type="button"
        class="login-link"
        (click)="goToLogin()">
        Sign In
      </button>

    </div>

  </div>

</div>
