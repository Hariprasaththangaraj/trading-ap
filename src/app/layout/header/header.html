<div class="app-layout" [class.collapsed]="isCollapsed">

  <!-- Sidebar -->
  <aside class="sidebar" id="app-sidebar">

    <!-- Brand and Toggle -->
    <div class="sidebar-header">

      <a class="brand" routerLink="/dashboard">
        <span class="brand-logo">T</span>

        <span class="brand-details">
          <span class="brand-name">Trading App</span>
          <span class="brand-subtitle">
            Market Intelligence Platform
          </span>
        </span>
      </a>

      <button type="button" class="sidebar-toggle" (click)="toggleSidebar()" [attr.aria-expanded]="!isCollapsed"
        aria-controls="app-sidebar" [attr.title]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
        [attr.aria-label]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">

        <span class="toggle-icon">
          {{ isCollapsed ? '»' : '«' }}
        </span>
      </button>

    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav" aria-label="Main navigation">

      <a class="nav-item" routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeSidebarOnMobile()" title="Dashboard">

        <span class="nav-icon">⌂</span>
        <span class="nav-label">Dashboard</span>
      </a>

<!-- Market Monitor -->
<div class="nav-group">

  <button
    type="button"
    class="nav-item nav-parent"
    [class.active]="marketMonitorExpanded"
    (click)="toggleMarketMonitor()"
    [attr.aria-expanded]="marketMonitorExpanded"
    title="Market Monitor">

    <span class="nav-icon">▥</span>
    <span class="nav-label">Market Monitor</span>

    <span class="nav-arrow">
      {{ marketMonitorExpanded ? '' : '›' }}
    </span>

  </button>

  @if (marketMonitorExpanded) {
    <div class="nav-submenu">

      <a class="nav-subitem" routerLink="/market-monitor/options-filter"
         routerLinkActive="active">
        <span class="nav-icon">▣</span>
        <span class="nav-label">Options Filter</span>
      </a>

      <a class="nav-subitem" routerLink="/market-monitor/option-chain"
         routerLinkActive="active">
        <span class="nav-icon">▤</span>
        <span class="nav-label">Option Chain</span>
      </a>

      <a class="nav-subitem" routerLink="/market-monitor/live-watch"
         routerLinkActive="active">
        <span class="nav-icon">◉</span>
        <span class="nav-label">Live Watch</span>
      </a>

      <a class="nav-subitem" routerLink="/heatmap"
         routerLinkActive="active">
        <span class="nav-icon">▦</span>
        <span class="nav-label">Heatmap</span>
      </a>

      <a class="nav-subitem" routerLink="/futures-data"
         routerLinkActive="active">
        <span class="nav-icon">↗</span>
        <span class="nav-label">Futures Data</span>
      </a>

    </div>
  }

</div>

    <!-- User Profile -->

      <div class="user-avatar">H</div>

      <div class="user-details">
        <span class="user-name">Trader</span>
        <span class="user-role">Account Profile</span>
      </div>

      <span class="profile-arrow">›</span>

    </div>

  </aside>

  <!-- Mobile Backdrop -->
  @if (!isCollapsed) {
  <div class="mobile-backdrop" (click)="closeSidebarOnMobile()" aria-hidden="true">
  </div>

  <!-- Main Content -->

    <!-- Top Header -->

      <div class="breadcrumb">
        <!-- <span class="breadcrumb-home">⌂</span>

      <div class="header-actions">

        <div class="market-status">
          <span class="status-dot"></span>

        </div>

        <button type="button" class="header-icon-button" aria-label="Notifications" title="Notifications">
